name: BlackDuck SCA Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 매주 일요일 오전 2시(UTC)에 실행
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # 수동 실행 가능

env:
  # BlackDuck 프로젝트 설정
  DETECT_PROJECT_NAME: "AgOpenGPS"
  DETECT_PROJECT_VERSION_NAME: "${{ github.ref_name }}-${{ github.run_number }}"

jobs:
  blackduck-scan:
    runs-on: windows-latest  # AgOpenGPS는 Windows Forms 프로젝트일 가능성이 높음
    name: BlackDuck Security Scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 전체 히스토리를 가져와서 더 정확한 분석
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          7.0.x
          8.0.x
    
    - name: Setup MSBuild (for .NET Framework projects)
      uses: microsoft/setup-msbuild@v2
      if: runner.os == 'Windows'
    
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
    
    - name: Find solution/project files
      id: find_projects
      run: |
        # .sln 파일 찾기
        $SLN_FILES = Get-ChildItem -Path . -Name "*.sln" -Recurse | Select-Object -First 1
        # .csproj 파일 찾기
        $CSPROJ_FILES = Get-ChildItem -Path . -Name "*.csproj" -Recurse
        
        Write-Host "Found solution files:"
        Get-ChildItem -Path . -Name "*.sln" -Recurse
        Write-Host "Found project files:"
        Get-ChildItem -Path . -Name "*.csproj" -Recurse
        
        if ($SLN_FILES) {
          Write-Host "Using solution file: $SLN_FILES"
          echo "BUILD_FILE=$SLN_FILES" >> $env:GITHUB_OUTPUT
          echo "BUILD_TYPE=solution" >> $env:GITHUB_OUTPUT
        } elseif ($CSPROJ_FILES) {
          # 첫 번째 csproj 파일 사용
          $FIRST_CSPROJ = $CSPROJ_FILES | Select-Object -First 1
          Write-Host "Using project file: $FIRST_CSPROJ"
          echo "BUILD_FILE=$FIRST_CSPROJ" >> $env:GITHUB_OUTPUT
          echo "BUILD_TYPE=project" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "No .NET project files found"
          echo "BUILD_FILE=" >> $env:GITHUB_OUTPUT
          echo "BUILD_TYPE=none" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh
    
    - name: Restore NuGet packages
      if: steps.find_projects.outputs.BUILD_TYPE != 'none'
      run: |
        $BUILD_FILE = "${{ steps.find_projects.outputs.BUILD_FILE }}"
        $BUILD_TYPE = "${{ steps.find_projects.outputs.BUILD_TYPE }}"
        
        if ($BUILD_FILE -and (Test-Path $BUILD_FILE)) {
          Write-Host "Restoring packages for: $BUILD_FILE"
          
          # .NET Core/5+/.NET 프로젝트인 경우
          if ($BUILD_FILE -match "\.csproj$|\.sln$") {
            # 먼저 dotnet restore 시도
            try {
              dotnet restore $BUILD_FILE
              Write-Host "Successfully restored with dotnet restore"
            } catch {
              Write-Host "dotnet restore failed, trying nuget restore"
              nuget restore $BUILD_FILE
            }
          }
        } else {
          Write-Host "No valid project files found, skipping restore"
        }
      shell: pwsh
    
    - name: Build project
      if: steps.find_projects.outputs.BUILD_TYPE != 'none'
      run: |
        $BUILD_FILE = "${{ steps.find_projects.outputs.BUILD_FILE }}"
        
        if ($BUILD_FILE -and (Test-Path $BUILD_FILE)) {
          Write-Host "Building: $BUILD_FILE"
          
          # .NET Core/5+/.NET 프로젝트 빌드 시도
          try {
            dotnet build $BUILD_FILE --no-restore --configuration Release
            Write-Host "Successfully built with dotnet build"
          } catch {
            Write-Host "dotnet build failed, trying msbuild"
            msbuild $BUILD_FILE /p:Configuration=Release /p:Platform="Any CPU"
          }
        } else {
          Write-Host "No valid project files found, skipping build"
        }
      shell: pwsh
    
    - name: Run BlackDuck Security Scan
      uses: blackduck-inc/black-duck-security-scan@v2
      with:
        # BlackDuck SCA 설정
        blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
        blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
        blackducksca_scan_full: true
        blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'
        blackducksca_reports_sarif_create: true
        blackducksca_prComment_enabled: true
        blackducksca_waitForScan: true
        # Detect 설정
        detect_args: |
          --detect.project.name=${{ env.DETECT_PROJECT_NAME }}
          --detect.project.version.name=${{ env.DETECT_PROJECT_VERSION_NAME }}
          --detect.code.location.name=${{ env.DETECT_PROJECT_NAME }}-${{ github.ref_name }}
          --detect.source.path=.
          --detect.excluded.directories=bin,obj,packages,.git,.vs,.vscode,node_modules
          --detect.detector.search.depth=10
          --detect.nuget.inspector.name=classic
          --detect.dotnet.path=C:\Program Files\dotnet\dotnet.exe
          --detect.risk.report.pdf=true
          --detect.notices.report=true
          --detect.cleanup=false
          --logging.level.com.synopsys.integration=INFO
        # GitHub 토큰
        github_token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload BlackDuck Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blackduck-reports-${{ github.run_number }}
        path: |
          **/BlackDuck_*_RiskReport.pdf
          **/BlackDuck_*_NoticesReport.txt
          **/scan.cli*.log
          **/status.json
          **/detect-*.log
        retention-days: 30
    
    - name: Parse scan results
      id: scan_results
      if: always()
      run: |
        # status.json에서 스캔 결과 파싱
        if [ -f "status.json" ]; then
          echo "SCAN_STATUS=$(jq -r '.overallStatus // "UNKNOWN"' status.json)" >> $GITHUB_OUTPUT
          echo "POLICY_STATUS=$(jq -r '.policyStatus // "UNKNOWN"' status.json)" >> $GITHUB_OUTPUT
          echo "COMPONENT_COUNT=$(jq -r '.componentCount // "0"' status.json)" >> $GITHUB_OUTPUT
          echo "VULNERABILITY_COUNT=$(jq -r '.vulnerabilityCount // "0"' status.json)" >> $GITHUB_OUTPUT
        else
          echo "SCAN_STATUS=UNKNOWN" >> $GITHUB_OUTPUT
          echo "POLICY_STATUS=UNKNOWN" >> $GITHUB_OUTPUT
          echo "COMPONENT_COUNT=0" >> $GITHUB_OUTPUT
          echo "VULNERABILITY_COUNT=0" >> $GITHUB_OUTPUT
        fi
    
    - name: Comment PR with scan results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const scanStatus = '${{ steps.scan_results.outputs.SCAN_STATUS }}';
          const policyStatus = '${{ steps.scan_results.outputs.POLICY_STATUS }}';
          const componentCount = '${{ steps.scan_results.outputs.COMPONENT_COUNT }}';
          const vulnerabilityCount = '${{ steps.scan_results.outputs.VULNERABILITY_COUNT }}';
          
          const statusIcon = scanStatus === 'SUCCESS' ? '✅' : scanStatus === 'FAILURE' ? '❌' : '⚠️';
          const policyIcon = policyStatus === 'IN_VIOLATION' ? '🚨' : policyStatus === 'NOT_IN_VIOLATION' ? '✅' : '⚠️';
          
          const comment = `## ${statusIcon} BlackDuck SCA 스캔 결과
          
          | 항목 | 결과 |
          |------|------|
          | **스캔 상태** | ${statusIcon} ${scanStatus} |
          | **정책 준수** | ${policyIcon} ${policyStatus} |
          | **발견된 컴포넌트** | ${componentCount}개 |
          | **취약점** | ${vulnerabilityCount}개 |
          
          📊 자세한 보고서는 [Artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})에서 확인하실 수 있습니다.
          
          ${vulnerabilityCount > 0 ? '⚠️ **주의**: 취약점이 발견되었습니다. 보고서를 확인해주세요.' : ''}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Create security issue on high vulnerabilities
      if: always() && steps.scan_results.outputs.VULNERABILITY_COUNT > 0
      uses: actions/github-script@v7
      with:
        script: |
          const vulnCount = parseInt('${{ steps.scan_results.outputs.VULNERABILITY_COUNT }}');
          const scanStatus = '${{ steps.scan_results.outputs.SCAN_STATUS }}';
          
          if (vulnCount >= 5) {  // 5개 이상의 취약점이 발견된 경우
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 보안 취약점 발견: ${vulnCount}개 - ${new Date().toISOString().split('T')[0]}`,
              body: `BlackDuck SCA 스캔에서 **${vulnCount}개**의 취약점이 발견되었습니다.
              
              ## 스캔 정보
              - **프로젝트**: ${process.env.DETECT_PROJECT_NAME}
              - **브랜치**: ${context.ref}
              - **커밋**: ${context.sha}
              - **스캔 상태**: ${scanStatus}
              
              ## 조치 필요
              1. [실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})에서 상세 보고서 확인
              2. 고위험 취약점 우선 해결
              3. 의존성 업데이트 검토
              
              **⚠️ 이 이슈는 취약점이 해결될 때까지 열어두시기 바랍니다.**`,
              labels: ['security', 'vulnerability', 'blackduck', 'high-priority']
            });
          }

  notify-results:
    needs: blackduck-scan
    runs-on: ubuntu-latest
    if: always() && needs.blackduck-scan.result == 'failure'
    steps:
    - name: Notify on scan failure
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🚨 BlackDuck SCA 스캔 실패 - ${new Date().toISOString().split('T')[0]}`,
            body: `BlackDuck SCA 스캔이 실패했습니다.
            
            ## 실행 정보
            - **브랜치**: ${context.ref}
            - **커밋**: ${context.sha}
            - **트리거**: ${context.eventName}
            - **실행 링크**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            
            ## 가능한 원인
            - BlackDuck 서버 연결 문제
            - 인증 토큰 만료
            - 프로젝트 빌드 실패
            - 정책 위반 (BLOCKER/CRITICAL)
            
            **🔧 로그를 확인하여 문제를 해결해주세요.**`,
            labels: ['security', 'blackduck', 'failure', 'urgent']
          });
