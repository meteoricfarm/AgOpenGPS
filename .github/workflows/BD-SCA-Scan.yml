name: BlackDuck SCA Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  DETECT_PROJECT_NAME: "AgOpenGPS"
  DETECT_PROJECT_VERSION_NAME: "${{ github.ref_name }}-${{ github.run_number }}"

jobs:
  blackduck-scan:
    runs-on: windows-latest
    name: BlackDuck Security Scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          7.0.x
          8.0.x
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      if: runner.os == 'Windows'
    
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Find solution/project files
      id: find_projects
      shell: pwsh
      run: |
        $SLN_FILES = Get-ChildItem -Path . -Name "*.sln" -Recurse | Select-Object -First 1
        $CSPROJ_FILES = Get-ChildItem -Path . -Name "*.csproj" -Recurse
        
        Write-Host "Found solution files:"
        Get-ChildItem -Path . -Name "*.sln" -Recurse
        Write-Host "Found project files:"
        Get-ChildItem -Path . -Name "*.csproj" -Recurse
        
        if ($SLN_FILES) {
          Write-Host "Using solution file: $SLN_FILES"
          echo "BUILD_FILE=$SLN_FILES" >> $env:GITHUB_OUTPUT
          echo "BUILD_TYPE=solution" >> $env:GITHUB_OUTPUT
        } elseif ($CSPROJ_FILES) {
          $FIRST_CSPROJ = $CSPROJ_FILES | Select-Object -First 1
          Write-Host "Using project file: $FIRST_CSPROJ"
          echo "BUILD_FILE=$FIRST_CSPROJ" >> $env:GITHUB_OUTPUT
          echo "BUILD_TYPE=project" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "No .NET project files found"
          echo "BUILD_FILE=" >> $env:GITHUB_OUTPUT
          echo "BUILD_TYPE=none" >> $env:GITHUB_OUTPUT
        }
    
    - name: Restore NuGet packages
      if: steps.find_projects.outputs.BUILD_TYPE != 'none'
      shell: pwsh
      run: |
        $BUILD_FILE = "${{ steps.find_projects.outputs.BUILD_FILE }}"        
        if ($BUILD_FILE -and (Test-Path $BUILD_FILE)) {
          Write-Host "Restoring packages for: $BUILD_FILE"          
          if ($BUILD_FILE -match "\.csproj$|\.sln$") {
            try {
              dotnet restore $BUILD_FILE
              Write-Host "Successfully restored with dotnet restore"
            } catch {
              Write-Host "dotnet restore failed, trying nuget restore"
              nuget restore $BUILD_FILE
            }
          }
        } else {
          Write-Host "No valid project files found, skipping restore"
        }
    
    - name: Build project
      if: steps.find_projects.outputs.BUILD_TYPE != 'none'
      shell: pwsh
      run: |
        $BUILD_FILE = "${{ steps.find_projects.outputs.BUILD_FILE }}"        
        if ($BUILD_FILE -and (Test-Path $BUILD_FILE)) {
          Write-Host "Building: $BUILD_FILE"          
          try {
            dotnet build $BUILD_FILE --no-restore --configuration Release
            Write-Host "Successfully built with dotnet build"
          } catch {
            Write-Host "dotnet build failed, trying msbuild"
            msbuild $BUILD_FILE /p:Configuration=Release /p:Platform="Any CPU"
          }
        } else {
          Write-Host "No valid project files found, skipping build"
        }
    
    - name: Run BlackDuck Security Scan
      uses: blackduck-inc/black-duck-security-scan@v2
      continue-on-error: true
      id: blackduck_scan
      with:
        blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
        blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
        blackducksca_scan_full: true
        blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'
        blackducksca_reports_sarif_create: true
        blackducksca_prComment_enabled: true
        blackducksca_waitForScan: true
        mark_build_status: 'success'
        detect_args: >-
          --detect.project.name=${{ env.DETECT_PROJECT_NAME }}
          --detect.project.version.name=${{ env.DETECT_PROJECT_VERSION_NAME }}
          --detect.code.location.name=${{ env.DETECT_PROJECT_NAME }}-${{ github.ref_name }}
          --detect.source.path=.
          --detect.excluded.directories=bin,obj,packages,.git,.vs,.vscode,node_modules
          --detect.detector.search.depth=10
          --detect.nuget.inspector.name=classic
          --detect.dotnet.path=C:\Program Files\dotnet\dotnet.exe
          --detect.risk.report.pdf=true
          --detect.notices.report=true
          --detect.cleanup=false
          --logging.level.com.synopsys.integration=INFO
          --detect.policy.check.fail.on.severities=NONE
        github_token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload BlackDuck Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blackduck-reports-${{ github.run_number }}
        path: |
          **/*RiskReport.pdf
          **/*NoticesReport.txt
          **/*sarif*.json
          **/scan.cli*.log
          **/status.json
          **/detect*.log
          .blackduck/**/*
        retention-days: 30
    
    - name: Parse scan results
      id: scan_results
      if: always()
      shell: pwsh
      run: |
        $sarifFile = Get-ChildItem -Path ".blackduck\integrations\blackducksca\sarif" -Name "*.sarif.json" -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if ($sarifFile) {
          $sarifPath = ".blackduck\integrations\blackducksca\sarif\$sarifFile"
          Write-Host "Found SARIF report: $sarifPath"
          
          $sarifContent = Get-Content -Path $sarifPath -Raw | ConvertFrom-Json
          $resultsCount = 0
          $criticalCount = 0
          $highCount = 0
          
          if ($sarifContent.runs -and $sarifContent.runs[0].results) {
            $resultsCount = $sarifContent.runs[0].results.Count
            
            foreach ($result in $sarifContent.runs[0].results) {
              if ($result.level -eq "error") { $criticalCount++ }
              elseif ($result.level -eq "warning") { $highCount++ }
            }
          }
          
          echo "SCAN_STATUS=SUCCESS" >> $env:GITHUB_OUTPUT
          echo "VULNERABILITY_COUNT=$resultsCount" >> $env:GITHUB_OUTPUT
          echo "CRITICAL_COUNT=$criticalCount" >> $env:GITHUB_OUTPUT
          echo "HIGH_COUNT=$highCount" >> $env:GITHUB_OUTPUT
          
          $scanResult = "${{ steps.blackduck_scan.outcome }}"
          if ($scanResult -eq "failure") {
            echo "POLICY_STATUS=IN_VIOLATION" >> $env:GITHUB_OUTPUT
          } else {
            echo "POLICY_STATUS=NOT_IN_VIOLATION" >> $env:GITHUB_OUTPUT
          }
          
          Write-Host "Results found: $resultsCount (Critical: $criticalCount, High: $highCount)"
        } else {
          Write-Host "No SARIF report found"
          echo "SCAN_STATUS=NO_REPORT" >> $env:GITHUB_OUTPUT
          echo "POLICY_STATUS=UNKNOWN" >> $env:GITHUB_OUTPUT
          echo "VULNERABILITY_COUNT=0" >> $env:GITHUB_OUTPUT
          echo "CRITICAL_COUNT=0" >> $env:GITHUB_OUTPUT
          echo "HIGH_COUNT=0" >> $env:GITHUB_OUTPUT
        }
    
    - name: Security Summary
      if: always()
      shell: pwsh
      run: |
        Write-Host "=== BlackDuck SCA 스캔 요약 ===" -ForegroundColor Cyan
        Write-Host "프로젝트: ${{ env.DETECT_PROJECT_NAME }}" -ForegroundColor White
        Write-Host "브랜치: ${{ github.ref_name }}" -ForegroundColor White
        Write-Host "커밋: ${{ github.sha }}" -ForegroundColor White
        Write-Host "스캔 결과: ${{ steps.blackduck_scan.outcome }}" -ForegroundColor White
        
        $vulnCount = "${{ steps.scan_results.outputs.VULNERABILITY_COUNT }}"
        $criticalCount = "${{ steps.scan_results.outputs.CRITICAL_COUNT }}"
        $highCount = "${{ steps.scan_results.outputs.HIGH_COUNT }}"
        $policyStatus = "${{ steps.scan_results.outputs.POLICY_STATUS }}"
        
        if ($vulnCount -and $vulnCount -ne "0") {
          Write-Host "발견된 항목: $vulnCount 개" -ForegroundColor Yellow
          Write-Host "   - Critical: $criticalCount 개" -ForegroundColor Red
          Write-Host "   - High: $highCount 개" -ForegroundColor Yellow
        } else {
          Write-Host "발견된 항목: 없음" -ForegroundColor Green
        }
        
        if ($policyStatus -eq "IN_VIOLATION") {
          Write-Host "정책 상태: 위반" -ForegroundColor Red
        } elseif ($policyStatus -eq "NOT_IN_VIOLATION") {
          Write-Host "정책 상태: 준수" -ForegroundColor Green
        } else {
          Write-Host "정책 상태: 알 수 없음" -ForegroundColor Yellow
        }
        
        Write-Host "상세 보고서는 아티팩트에서 확인하세요." -ForegroundColor Cyan
        Write-Host "================================" -ForegroundColor Cyan

    - name: Create vulnerability issues
      if: always() && steps.scan_results.outputs.VULNERABILITY_COUNT > 0
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const sarifPath = '.blackduck\\integrations\\blackducksca\\sarif';
            if (fs.existsSync(sarifPath)) {
              const sarifFiles = fs.readdirSync(sarifPath).filter(file => file.endsWith('.sarif.json'));
              
              if (sarifFiles.length > 0) {
                const sarifFilePath = path.join(sarifPath, sarifFiles[0]);
                const sarifContent = JSON.parse(fs.readFileSync(sarifFilePath, 'utf8'));
                
                const existingIssues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: 'blackduck-vulnerability',
                  state: 'open'
                });
                
                const existingTitles = existingIssues.data.map(issue => issue.title);
                
                if (sarifContent.runs && sarifContent.runs[0] && sarifContent.runs[0].results) {
                  const vulnerabilities = sarifContent.runs[0].results;
                  console.log('발견된 취약점 수: ' + vulnerabilities.length + '개');
                  
                  // 컴포넌트별로 취약점 그룹화
                  const componentGroups = {};
                  vulnerabilities.forEach(vuln => {
                    let component = vuln.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'Unknown component';
                    
                    // URL 디코딩 및 경로 정리
                    component = decodeURIComponent(component);
                    
                    // 파일 경로에서 파일명만 추출 (Windows/Unix 경로 모두 처리)
                    const pathSeparators = /[\\\/]/;
                    if (pathSeparators.test(component)) {
                      const pathParts = component.split(pathSeparators);
                      component = pathParts[pathParts.length - 1]; // 마지막 부분(파일명)만 사용
                    }
                    
                    // 특수문자 정리 (GitHub 이슈 제목에 적합하게)
                    component = component.replace(/[<>:"|?*]/g, '_');
                    
                    if (!componentGroups[component]) {
                      componentGroups[component] = [];
                    }
                    componentGroups[component].push(vuln);
                  });
                  
                  // BlackDuck View URL 생성
                  const blackduckUrl = process.env.BLACKDUCK_URL || '${{ secrets.BLACKDUCK_URL }}';
                  const projectName = process.env.DETECT_PROJECT_NAME;
                  const versionName = process.env.DETECT_PROJECT_VERSION_NAME;
                  const blackduckViewUrl = blackduckUrl + '/api/projects/' + encodeURIComponent(projectName) + '/versions/' + encodeURIComponent(versionName);
                  
                  let processedComponents = 0;
                  const maxComponents = 10; // 최대 10개 컴포넌트까지 처리
                  
                  for (const [component, vulnList] of Object.entries(componentGroups)) {
                    if (processedComponents >= maxComponents) break;
                    
                    const issueTitle = '보안 취약점: ' + component + ' (' + vulnList.length + '개)';
                    
                    // 중복 체크
                    if (existingTitles.some(title => title.includes(component) && title.includes('보안 취약점'))) {
                      console.log('중복 이슈 스킵: ' + issueTitle);
                      continue;
                    }
                    
                    // 심각도별 분류
                    let criticalCount = 0;
                    let highCount = 0;
                    let mediumCount = 0;
                    let maxSeverity = 'medium';
                    
                    vulnList.forEach(vuln => {
                      const level = vuln.level || 'info';
                      switch(level.toLowerCase()) {
                        case 'error':
                          criticalCount++;
                          maxSeverity = 'critical';
                          break;
                        case 'warning':
                          highCount++;
                          if (maxSeverity !== 'critical') maxSeverity = 'high';
                          break;
                        default:
                          mediumCount++;
                      }
                    });
                    
                    // 최고 심각도에 따른 라벨링
                    let severityIcon, priorityLabel;
                    switch(maxSeverity) {
                      case 'critical':
                        severityIcon = '🔴';
                        priorityLabel = 'high-priority';
                        break;
                      case 'high':
                        severityIcon = '🟠';
                        priorityLabel = 'medium-priority';
                        break;
                      default:
                        severityIcon = '🟡';
                        priorityLabel = 'low-priority';
                    }
                    
                    // 이슈 본문 생성
                    let issueBody = severityIcon + ' **컴포넌트**: ' + component + '\n';
                    issueBody += '**발견된 취약점**: ' + vulnList.length + '개\n\n';
                    
                    // 심각도별 요약
                    issueBody += '## 심각도별 요약\n';
                    if (criticalCount > 0) issueBody += '- 🔴 **Critical**: ' + criticalCount + '개\n';
                    if (highCount > 0) issueBody += '- 🟠 **High**: ' + highCount + '개\n';
                    if (mediumCount > 0) issueBody += '- 🟡 **Medium/Low**: ' + mediumCount + '개\n';
                    issueBody += '\n';
                    
                    // 개별 취약점 목록
                    issueBody += '## 취약점 상세 목록\n';
                    vulnList.forEach((vuln, index) => {
                      const ruleId = vuln.ruleId || 'Unknown';
                      const message = vuln.message?.text || 'No description available';
                      const level = vuln.level || 'info';
                      
                      let levelIcon = '🟡';
                      if (level.toLowerCase() === 'error') levelIcon = '🔴';
                      else if (level.toLowerCase() === 'warning') levelIcon = '🟠';
                      
                      issueBody += (index + 1) + '. ' + levelIcon + ' **' + ruleId + '**\n';
                      issueBody += '   - **설명**: ' + message.substring(0, 100) + (message.length > 100 ? '...' : '') + '\n';
                      issueBody += '   - **레벨**: ' + level + '\n\n';
                    });
                    
                    // BlackDuck 링크 및 조치 방법
                    issueBody += '## 상세 분석 및 해결방법\n';
                    issueBody += '🔗 **BlackDuck 상세 보고서**: [프로젝트 보기](' + blackduckViewUrl + ')\n\n';
                    
                    issueBody += '## 권장 조치사항\n';
                    issueBody += '1. **우선순위**: Critical → High → Medium 순으로 해결\n';
                    issueBody += '2. **컴포넌트 업데이트**: ' + component + '의 최신 버전 확인\n';
                    issueBody += '3. **보안 패치**: 보안 패치가 포함된 버전으로 업데이트\n';
                    issueBody += '4. **의존성 검토**: 간접 의존성까지 포함하여 영향 범위 확인\n';
                    issueBody += '5. **대안 검토**: 필요시 보안성이 검증된 대안 라이브러리 고려\n';
                    issueBody += '6. **재스캔**: 수정 후 워크플로우 재실행으로 해결 확인\n\n';
                    
                    issueBody += '## 관련 정보\n';
                    issueBody += '- **프로젝트**: ' + process.env.DETECT_PROJECT_NAME + '\n';
                    issueBody += '- **버전**: ' + process.env.DETECT_PROJECT_VERSION_NAME + '\n';
                    issueBody += '- **브랜치**: ' + context.ref + '\n';
                    issueBody += '- **스캔 일시**: ' + new Date().toISOString().split('T')[0] + '\n';
                    issueBody += '- **실행 로그**: [GitHub Actions](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n';
                    issueBody += '- **아티팩트**: [SARIF 보고서 다운로드](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\n';
                    
                    issueBody += '> 이 이슈는 BlackDuck SCA 스캔에서 자동으로 생성되었습니다. ' + vulnList.length + '개의 취약점이 동일 컴포넌트에서 발견되어 그룹화하였습니다.';

                    try {
                      const issue = await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: issueTitle,
                        body: issueBody,
                        labels: [
                          'blackduck-vulnerability',
                          'security',
                          maxSeverity,
                          priorityLabel,
                          'component-group',
                          'auto-generated'
                        ]
                      });
                      
                      console.log('그룹 이슈 생성 완료: ' + issueTitle + ' (#' + issue.data.number + ')');
                      processedComponents++;
                      
                      // API 속도 제한 방지
                      await new Promise(resolve => setTimeout(resolve, 1000));
                      
                    } catch (error) {
                      console.log('이슈 생성 실패 (' + issueTitle + '): ' + error.message);
                    }
                  }
                  
                  console.log('총 ' + processedComponents + '개 컴포넌트의 이슈를 생성했습니다.');
                  if (Object.keys(componentGroups).length > maxComponents) {
                    console.log((Object.keys(componentGroups).length - maxComponents) + '개의 추가 컴포넌트가 있습니다.');
                  }
                }
              }
            }
          } catch (error) {
            console.log('취약점 이슈 생성 중 오류: ' + error.message);
          }

  notify-results:
    needs: blackduck-scan
    runs-on: windows-latest
    if: always() && needs.blackduck-scan.result == 'failure'
    steps:
    - name: Notify on scan failure
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          console.log('BlackDuck SCA 스캔이 실패했습니다.');
          console.log('브랜치: ' + context.ref);
          console.log('커밋: ' + context.sha);
          console.log('실행 링크: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId);
          
          try {
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            if (repo.data.has_issues) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'BlackDuck SCA 스캔 실패 - ' + new Date().toISOString().split('T')[0],
                body: 'BlackDuck SCA 스캔이 실패했습니다.\n\n## 실행 정보\n- **브랜치**: ' + context.ref + '\n- **커밋**: ' + context.sha + '\n- **트리거**: ' + context.eventName + '\n- **실행 링크**: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\n## 가능한 원인\n- BlackDuck 서버 연결 문제\n- 인증 토큰 만료\n- 프로젝트 빌드 실패\n- 정책 위반 (BLOCKER/CRITICAL)\n\n로그를 확인하여 문제를 해결해주세요.',
                labels: ['security', 'blackduck', 'failure', 'urgent']
              });
            } else {
              console.log('Issues 기능이 비활성화되어 있습니다.');
            }
          } catch (error) {
            console.log('Issues 생성 실패: ' + error.message);
          }
